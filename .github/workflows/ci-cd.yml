name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the source code from GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup the recommended, modern Node.js 24 environment
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Only include 'cache' if package-lock.json exists in your root folder
        cache: 'npm' 

    # 3. Install fresh dependencies using the lock file
    - name: Install dependencies
      run: npm ci

    # 4. Run production builds and test suites
    - name: Run build
      run: npm run build --if-present

    - name: Run tests
      run: npm test
