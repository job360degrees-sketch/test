name: CI/CD Pipeline

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" , "test"]
  pull_request:
    branches: [ "main" , "test" ]

jobs:
  # Continuous Integration Stage: Build and Test
  Build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the source code from GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup the recommended, modern Node.js 24 environment
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        # Only include 'cache' if package-lock.json exists in your root folder
        cache: 'npm' 

    # 3. Install fresh dependencies using the lock file
    - name: Install dependencies
      run: npm ci

    # 4. Run production builds and test suites
    - name: Run build
      run: npm run build --if-present

    - name: Run tests
      run: npm test

  # Continuous Deployment Stage: Runs only if the Integration stage passes
  Deploy:
    needs: Build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Simulate Production Deployment
      run: |
        echo "Deploying application to production environment..."
        # Add actual deployment CLI commands here (e.g., AWS, Azure, Vercel, or Heroku)
        echo "Application successfully deployed!"
